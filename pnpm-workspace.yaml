# i18next (transitive via Allure) declares peerDependencies typescript ^5,
# but the project uses TypeScript 6. The mismatch is cosmetic — i18next
# doesn't use the TypeScript API at runtime.
peerDependencyRules:
  allowedVersions:
    i18next>typescript: ">=5"

allowBuilds:
  cpu-features: true
  esbuild: true
  protobufjs: true
  simple-git-hooks: true
  ssh2: true

# Known vulnerabilities in transitive dev dependencies (VitePress 1.x → vite 5.x → esbuild 0.21.x).
# All are dev-only and only affect the local docs preview server.
# No compatible fix exists until VitePress 2.0 ships with vite 6.x.
# Re-evaluate when upgrading VitePress to 2.x.
auditConfig:
  ignoreGhsas:
    # esbuild <=0.24.2: dev server request forgery
    - GHSA-67mh-4wv8-2f99
    # vite <=6.4.1: path traversal in optimized deps .map handling
    - GHSA-4w7w-66w2-5vf9
    # vite <=6.4.2: server.fs.deny bypass on Windows alternate paths
    - GHSA-fx2h-pf6j-xcff
    # vite <=6.4.2: launch-editor NTLMv2 hash disclosure via UNC path on Windows
    - GHSA-v6wh-96g9-6wx3
